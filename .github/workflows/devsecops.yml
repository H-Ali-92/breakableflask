name: Automatisation des tests DevSecOps
on: push
jobs:
  Dependances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependances
        run: |
          for f in $(find . -name "*requirements*.txt"); do
            echo "===== $f ====="
            docker run --rm \
              -v "$PWD/$f":/project/requirements.txt:ro \
              -v $HOME/.cache/trivy:/root/.cache/ \
              aquasec/trivy:latest fs --exit-code 1 /project/requirements.txt
          done
  Dockerfile:
    runs-on: ubuntu-latest
    needs: Dependances
    steps:
      - uses: actions/checkout@v4
      - name: Test Dockerfile
        run: |
          docker run --rm -v "$PWD":/project \
            aquasec/trivy:latest config --exit-code 1 /project/Dockerfile
  Deploy:
    runs-on: ubuntu-latest
    needs: Dockerfile
    steps:
      - name: Deploy
        run: |
          echo "Rien à faire ici. Votre application est prête à être déployée"
